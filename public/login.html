<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strum — Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050505;--card:rgba(32,32,34,.66);--text:#f2f2f4;--muted:#94949b;--dim:#606063;--accent:#1A8FFF;--accent-rgb:26,143,255;--green:#2ED158;--amber:#F59A0A;--red:#F04038;--indigo:#5E5CE6;--cyan:#5EC8FF;--gray-rgb:118,118,128;--r-xl:32px;--r-lg:24px;--r-md:16px;--spring:cubic-bezier(.34,1.56,.64,1);--font:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--space-3xs:3px;--space-xxs:4px;--space-xs:6px;--space-sm:8px;--space-md:12px;--space-lg:16px;--space-xl:20px;--space-2xl:24px;--space-3xl:32px;--r-xs:8px;--r-sm:12px;--r-pill:980px;--blur-sm:6px;--blur-md:20px;--blur-lg:30px;--fs-2xs:10px;--fs-xs:11px;--fs-sm:13px;--fs-base:15px;--fs-md:17px;--fs-lg:20px;--fs-xl:24px;--fs-2xl:28px;--fs-3xl:34px;--fs-4xl:44px;--fs-5xl:52px;--shadow-sm:0 1px 3px rgba(0,0,0,.35);--shadow-md:0 4px 16px rgba(0,0,0,.30);--shadow-lg:0 8px 24px rgba(0,0,0,.35);--shadow-xl:0 14px 34px rgba(var(--accent-rgb),.45);--shadow-inner:inset 0 0 0 1px rgba(255,255,255,.06);--shadow-glow-green:0 0 8px var(--green)}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-xl)}
.login{width:min(400px,100%);padding:var(--space-3xl) var(--space-2xl);text-align:center;animation:pop .6s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.icon{width:84px;height:84px;margin:0 auto var(--space-xl);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--indigo),var(--accent));font-size:var(--fs-4xl);color:#fff;box-shadow:var(--shadow-xl)}
h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:var(--fs-sm);margin:var(--space-xs) 0 var(--space-2xl)}
.field{display:flex;align-items:center;gap:var(--space-sm);background:rgba(var(--gray-rgb),.14);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-md);padding:0 var(--space-md);margin-bottom:var(--space-md);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.22)}
.field i{color:var(--muted);font-size:var(--fs-base)}
.field input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:var(--fs-base);padding:var(--space-md) 0;min-width:0}
.err{color:var(--red);font-size:var(--fs-sm);min-height:18px;margin:var(--space-3xs) 0 var(--space-sm);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);border:0;cursor:pointer;border-radius:var(--r-pill);font-weight:700;font-size:var(--fs-base);padding:var(--space-md) var(--space-2xl);min-height:48px;width:100%;background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(var(--accent-rgb),.4);transition:transform .12s,filter .15s}
.btn:active{transform:scale(.95);filter:brightness(.85)}
.btn:disabled{opacity:.5;pointer-events:none}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{margin-top:var(--space-lg);font-size:var(--fs-xs);color:var(--dim)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="login">
  <div class="icon"><i class="bi bi-lightning-charge-fill"></i></div>
  <h1>Strum</h1>
  <p class="sub">Backup Power · Smart Plugs · Autonomy</p>
  <form id="f" autocomplete="on">
    <label class="field"><i class="bi bi-person-fill"></i><input id="u" autocomplete="username" placeholder="Username" value="admin"></label>
    <label class="field"><i class="bi bi-lock-fill"></i><input id="p" type="password" autocomplete="current-password" placeholder="Password"></label>
    <div id="e" class="err"></div>
    <button class="btn" type="submit" id="b"><i class="bi bi-arrow-right-circle-fill"></i> Sign In</button>
  </form>
  <p class="hint">Raspberry Pi · Solarman V5 · Tuya Local · PWA</p>
</div>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('b'),e2=document.getElementById('e');
  b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});
    const d=await r.json();
    if(d&&d.success){window.location.href='/';}
    else{e2.textContent=(d&&d.message)||'Invalid credentials';const c=document.querySelector('.login');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
  }catch(err){e2.textContent='Server unreachable.';}
  b.disabled=false;b.innerHTML='<i class="bi bi-arrow-right-circle-fill"></i> Sign In';
});
</script>
</body>
</html>
