<!DOCTYPE html>
<html lang="uk" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>Увійти · Струм</title>
<link href="/tokens.css" rel="stylesheet">
<link href="/vendor/phosphor-icons.css" rel="stylesheet">
<link href="/login.css" rel="stylesheet">
</head>
<body>
<div class="ambient"></div>
<div class="glow"></div>
<div class="card" id="loginCard">
  <div class="brand-ic"><i class="ph-fill ph-lightning"></i></div>
  <h1>Струм</h1>
  <p class="sub">Увійдіть для продовження</p>
  <form id="loginForm" autocomplete="on">
    <div class="field"><label>Ім'я користувача</label><input type="text" id="username" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label>Пароль</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <button type="submit" id="loginBtn">Увійти</button>
    <div class="error" id="loginError"></div>
  </form>
</div>
<div class="overlay" id="changeOverlay">
  <div class="card" id="changeCard">
    <div class="brand-ic"><i class="ph-fill ph-shield-check"></i></div>
    <h1>Зміна пароля</h1>
    <p class="sub">Перший вхід вимагає нового пароля</p>
    <div class="field"><label>Новий пароль</label><input type="password" id="newPass" minlength="6" required></div>
    <div class="field"><label>Підтвердіть пароль</label><input type="password" id="confirmPass" minlength="6" required></div>
    <button type="button" id="changeBtn" onclick="doChange()">Встановити</button>
    <div class="error" id="changeError"></div>
  </div>
</div>
<script src="/login.js"></script>
</body>
</html>
